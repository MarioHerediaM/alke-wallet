{% extends 'base.html' %}

{% block title %}Eliminar Cliente{% endblock %}

{% block content %}
    <h1>¿Eliminar a {{ object.nombre }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar</button>
    </form>
    <a href="{% url 'cliente-list' %}">Cancelar</a>
{% endblock %}
